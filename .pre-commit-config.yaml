repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.3.0
    hooks:
      - id: ruff
        args: [ --fix ]
        files: ^(dev|tests)/
      - id: ruff-format
        files: ^(dev|tests)/

  - repo: local
    hooks:
      - id: pytest
        name: pytest
        entry: bash -c 'cd tests && uv run pytest'
        language: system
        pass_filenames: false
        always_run: true
