[project]
name = "gst-audio-bridge-tests"
version = "0.1.0"
description = "Test environment for gst-audio-bridge"
requires-python = ">=3.11"
dependencies = [
    "pytest>=8.0.0",
    "ruff>=0.1.0",
    "pre-commit>=3.5.0",
    "PyGObject>=3.42.0,<3.50.0",
    "numpy>=1.24.0",
    "gst-audio-bridge",
]

[tool.uv.sources]
gst-audio-bridge = { path = "../dev", editable = true }

[tool.pytest.ini_options]
testpaths = ["."]
python_files = ["test_*.py"]
python_functions = ["test_*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E402"]
